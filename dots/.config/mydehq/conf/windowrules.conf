# MyDE Window & Layer Rules Configuration


# ======================== Float/Dim Rules ===========================

windowrule = match:class .*, center on
windowrule = match:float on, animation slide up

windowrule = dim_around on , match:focus 1, match:workspace special:scratchpad
windowrule = float on, match:class .*(float|blueman-manager|zenity|yad|nwg-look).*

windowrule {
    name = Settings Windows

    float = on
    size = 796 541
    match:title = .*([Ss]ettings|[Pp]references|[Cc]onfiguration|[Cc]onfigure).*
}


#------------------- App Specific --------------------

windowrule {
  name = Audio Control Dialog

  float = on
  size = 592 317
  move = (1315) (54)
  match:class = wiremix
}

windowrule {
    name = Network Dialog

    float = on
    size = 571 364
    move = (1318) (45)
    dim_around = off
    match:class = ^(com.network.manager|NetworkManager|nm-connection-editor|Wicd-client.py|wicd-client)$
}

windowrule {
    name = Bluetooth Dialog

    float = on
    size = 571 364
    move = (1229) (45)
    dim_around = off
    match:class = ^(blueman-manager|Blueman-manager)$
}

windowrule {
    name = Float Kasts

    float = on
    size = 1146 770
    dim_around = off
    match:class = org.kde.kasts
}

windowrule {
    name = Ddcui UI

    float = on
    dim_around = on
    match:class = ddcui
}

windowrule {
    name = Float Disk Usage Analyzer

    float = on
    size = 960 619
    match:class = ^(org.gnome.baobab|org.kde.filelight)$
}

windowrule {
    name = Float Kde Connect

    center = on
    float = on
    size = 911 614
    match:class = .*(kdeconnect).*
}

windowrule {
    name = Float Torrent clients

    float = on
    size = 1200 802
    match:class = (?i).*(ktorrent|transmission-qt)
}

windowrule {
    name = Float, Resize ScreenShot window

    float = on
    pin = on
    dim_around = on
    match:class = satty
}

windowrule {
    name = Float, Resize Picture Viewer

    float = on
    size = 1223 795
    match:class = (org.kde.gwenview|org.nomacs.ImageLounge)
}

windowrule {
    name = Antigravity Brave Window

    float = on
    pin = on
    dim_around = on
    match:class = brave-browser
    match:title = about:blank - Brave
}

windowrule {
    name = KeepassXC window rules

    float = on
    size = 1174 765
    match:class = (?i).*(keepassxc).*
}

windowrule {
    name = File Manager Action window

    float = on
    min_size = 700, 339
    center = on
    dim_around = on

    match:class = pcmanfm-qt
    match:title = (?i).*(copy|rename|move|delete|search).*
}



windowrule {
    name = Mpv music player mode

    float = on
    size = 389 445
    match:title = ^.*\.(mp3|m4a|oga|flac|wav|opus) - mpv$
    match:class = mpv
}

windowrule {
    name = Archiver window

    float = on
    center = on
    size = 857 588
    match:class = lxqt-archiver
}


#=================== Polkit & File Operation Dialogs =====================

windowrule {
  name = File Operation Dialogs (classes)

  float = on
  center = on
  dim_around = on
  animation = popout
  size = 1036 638
  match:class = .*(xdg-desktop-portal).*
}

windowrule {
  name = File Operation Dialogs (titles)

  float = on
  center = on
  dim_around = on
  animation = popout
  size = 1036 638
  match:title = (?i).*([Ff]ile [Oo]peration|[Oo]pen [Ff]ile|[Oo]pen [Dd]ocument|[Ss]ave [Ff]ile|[Ss]ave [Aa]s|[Ss]elect [Aa] Folder|[Cc]hoose|[Uu]pload|[Oo]pen|[Ss]ave|[Ss]elect|[Ss]elect [Rr]ecording [Dd]irectory|[Aa]dd [Ff]older|[Aa]dd [Dd]ir|[Aa]dd [Ff]ile)(.*)
}


windowrule {
  name = Polkit Operation Dialogs

  float = on
  center = on
  animation = popout
  dim_around = on
  min_size = 520 195
  match:class = .*(polkit|authentication)(.*)
}

# =================== Picture-in-Picture ========================

windowrule {
  name = Picture-in-Picture Rules

  float = on
  pin = on
  animation = slide down
  move = ((monitor_w*0.735)-)
  match:title = ^(Picture-in-Picture)$                 # Float
}

# ===================== No VRR ==========================

windowrule = no_vrr on , match:class mpv
